<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip Eight - Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="img/favicon.png" />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- =========================================
       Cabeçalho e Menu
    ========================================= -->

    <header class="cabecalho">
      <div class="logo-container">
        <a href="index.html">
          <img src="img/logo.png" alt="Flip Eight" class="logo" />
        </a>
      </div>

      <nav class="menu-principal">
        <button
          class="btn-hamburguer"
          aria-label="Abrir Menu"
          onclick="alternarMenu()"
        >
          ☰
        </button>

        <ul id="lista-menu">
          <li><a href="index.html">INÍCIO</a></li>

          <li class="dropdown">
            <a href="produtos.html" class="dropbtn"
              >PRODUTOS
              <i
                class="fa-solid fa-chevron-down"
                style="font-size: 0.7em; margin-left: 6px"
              ></i
            ></a>
            <ul class="dropdown-conteudo" id="drop-categorias">
              <li><a href="produtos.html?categoria=camisetas">Camisetas</a></li>
              <li><a href="produtos.html?categoria=canecas">Canecas</a></li>
              <li><a href="produtos.html?categoria=bones">Bonés</a></li>
              <li><a href="produtos.html?categoria=figures">Figures</a></li>
              <li><a href="produtos.html?categoria=decoracao">Decoração</a></li>
            </ul>
          </li>

          <li><a href="cadastro.html">CADASTRO</a></li>
        </ul>
      </nav>

      <div class="barra-pesquisa">
        <input
          type="text"
          placeholder="O que você procura?"
          aria-label="Campo de busca"
        />
        <button aria-label="Buscar" class="icone btn-busca">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div class="icones-acao">
        <button
          id="btn-tema"
          aria-label="Alternar Tema"
          class="icone"
          onclick="alternarTema()"
        >
          <i class="fa-solid fa-moon"></i>
        </button>

        <button aria-label="Perfil" class="icone">
          <i class="fa-solid fa-user"></i>
        </button>

        <button
          aria-label="Carrinho"
          class="icone carrinho-btn"
          onclick="alternarCarrinho()"
        >
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="contador" class="badge-carrinho">0</span>
          <span id="palavra">itens</span>
        </button>
      </div>
    </header>

    <!-- =========================================
       Conteúdo Principal - Formulário de Cadastro
    ========================================= -->

    <main>
      <section id="cadastro">
        <h2>Cadastre-se</h2>
        <form
          action=""
          method="post"
          onsubmit="return validarCadastro();"
          novalidate
        >
          <fieldset>
            <legend>Seus dados</legend>
            <label for="nome">Nome completo</label>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Como você quer ser chamado"
              required
              minlength="3"
              maxlength="80"
              oninput="conferirNome()"
            />
            <p id="erro-nome" class="erro"></p>

            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="voce@exemplo.com"
              required
            />
            <p id="erro-email" class="erro"></p>

            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              pattern="[0-9]{2} [0-9]{5}-[0-9]{4}"
              placeholder="21 99999-9999"
              required
            />
            <p id="erro-telefone" class="erro"></p>
          </fieldset>

          <fieldset>
            <legend>Sua mensagem</legend>

            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto" onchange="mudarDica()">
              <option value="duvida">Dúvida sobre um produto</option>
              <option value="pedido">Acompanhar um pedido</option>
              <option value="troca">Troca ou devolução</option>
              <option value="parceria">Parceria</option>
            </select>
            <p id="dica" class="dica">Diga qual produto.</p>

            <label for="mensagem">Mensagem</label>
            <textarea
              id="mensagem"
              name="mensagem"
              rows="4"
              placeholder="Escreva aqui o que você precisa..."
            ></textarea>
            <p id="erro-mensagem" class="erro"></p>

            <label>
              <input type="checkbox" id="aceite" name="aceite" required />
              Aceito receber novidades da loja
            </label>
            <p id="erro-aceite" class="erro"></p>
          </fieldset>

          <button type="submit">Enviar cadastro</button>
          <p id="resultado" class="aviso"></p>
        </form>
      </section>
    </main>

    <!-- =========================================
       Rodapé
    ========================================= -->

    <footer class="rodape">
      <p>&copy; 2026 Flip Eight. Do fliperama para a sua coleção.</p>
    </footer>

    <!-- =========================================
       Carrinho
    ========================================= -->

    <div id="aviso" class="toast"></div>
    <div
      id="fundo-carrinho"
      class="fundo-carrinho"
      onclick="fecharCarrinho()"
    ></div>

    <aside
      id="painel-carrinho"
      class="painel-carrinho"
      aria-label="Meu carrinho"
    >
      <div class="carrinho-topo">
        <button
          type="button"
          class="btn-fechar"
          aria-label="Fechar carrinho"
          onclick="fecharCarrinho()"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Meu carrinho</h2>
      </div>
      <div class="carrinho-corpo">
        <ul id="lista-carrinho"></ul>
      </div>
      <div class="carrinho-rodape">
        <p class="total-carrinho">Total: <span id="total">R$ 0,00</span></p>
        <button type="button" onclick="enviarWhatsApp()">
          Pedir no WhatsApp
        </button>
        <button type="button" onclick="limparCarrinho()">
          Esvaziar Carrinho
        </button>
      </div>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
